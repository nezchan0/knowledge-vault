<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Vault — Personal Learning Journal</title>
  <meta name="description" content="A personal knowledge vault for learning, journaling, and building a second brain. Browse, search, and filter your notes.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <div class="container">
      <a href="index.html" class="header__brand">
        <div class="header__icon">🧠</div>
        <span class="header__title">Knowledge Vault</span>
      </a>
      <div class="header__actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="page-hero" id="page-hero">
    <div class="container">
      <h1 class="page-hero__title">Knowledge Vault</h1>
      <p class="page-hero__subtitle">Your personal learning journal, knowledge base, and second brain.</p>
      <div class="page-hero__count" id="note-count">
        <span>📝</span>
        <span id="note-count-text">Loading…</span>
      </div>
    </div>
  </section>

  <!-- Search -->
  <section class="search-section" id="search-section">
    <div class="container">
      <div class="search-box">
        <span class="search-box__icon">🔍</span>
        <input
          type="text"
          class="search-box__input"
          id="search-input"
          placeholder="Search notes by title, tags, or summary…"
          autocomplete="off"
        >
      </div>
    </div>
  </section>

  <!-- Filters -->
  <section class="filters-section" id="filters-section">
    <div class="container">
      <!-- Type Filters -->
      <div class="filter-group" id="type-filters">
        <span class="filter-group__label">Type</span>
        <div class="filter-chips" id="type-chips"></div>
      </div>
      <!-- Tag Filters -->
      <div class="filter-group" id="tag-filters">
        <span class="filter-group__label">Tags</span>
        <div class="filter-chips" id="tag-chips"></div>
      </div>
      <!-- Date Filter & Sort -->
      <div class="filter-row" id="date-sort-row">
        <div class="date-filter" id="date-filter">
          <span class="filter-group__label">Date Range</span>
          <div class="date-filter__inputs">
            <input type="date" class="date-input" id="date-from" aria-label="From date">
            <span class="date-filter__sep">→</span>
            <input type="date" class="date-input" id="date-to" aria-label="To date">
            <button class="date-filter__clear" id="date-clear" title="Clear dates">✕</button>
          </div>
        </div>
        <div class="sort-control" id="sort-control">
          <span class="filter-group__label">Sort</span>
          <button class="sort-toggle" id="sort-toggle">
            <span class="sort-toggle__icon" id="sort-icon">↓</span>
            <span id="sort-label">Newest First</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Notes List -->
  <main id="notes-container">
    <div class="container">
      <div class="notes-grid" id="notes-grid">
        <div class="loading" id="loading">
          <div class="loading__spinner"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>Knowledge Vault — Built with ❤️ for learning</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
