<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note — Knowledge Vault</title>
  <meta name="description" content="Reading a note in the Knowledge Vault.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/notes.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <div class="container">
      <a href="index.html" class="header__brand">
        <div class="header__icon">🧠</div>
        <span class="header__title">Knowledge Vault</span>
      </a>
      <div class="header__actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Note Content Area -->
  <main id="note-main">
    <div class="note-viewer" id="note-viewer">
      <div class="loading" id="loading">
        <div class="loading__spinner"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>Knowledge Vault — Built with ❤️ for learning</p>
    </div>
  </footer>

  <script src="assets/js/note.js"></script>
</body>
</html>
